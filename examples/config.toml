# All keys are optional except username for a live render.
username = "YOUR-USERNAME" # Replace with your actual GitHub login.
ships = 6
scale = 2
fps = 10
duration = 10
activity_window = 30 # 1 = day, 7 = week, 30 = month, 365 = year; affects commits and movement.
lighthouse_beam = true # Optional rotating yellow ray; false keeps only the lantern blink.
rain = false # Optional pixel rain with tiny ocean impact ripples.
include_non_code = false # Only programming/scripting commits; true also includes docs/config/unknown.
watermark = true # Optional top-left Git Ship label with the selected activity period.
display_commits = false # Optional full commit total at the bottom right of the fleet.
huge_cargo_ship = false # One heavy ship for all commits; large containers hold six commits.
cargo_logos = false # Language symbols on the huge ship; adds per-commit language detection.
include_forks = false
include_archived = true
include = [] # Empty means all public, owned repositories.
exclude = ["*-generated"] # Matches short names or owner/name, case-insensitively.
# seed = "my-stable-fleet" # Optional reproducible layout; omit for a fresh layout each run.
# observation_date = 2026-10-01 # TOML date or ISO string; live default is today UTC.

[labels]
"JavaScript" = "JS"
"C#" = "C#"
"Objective-C" = "OBJ-C"

[colors]
"Rust" = "#a34e44"
