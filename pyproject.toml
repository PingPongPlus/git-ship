[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ship"
version = "0.1.0"
description = "A little lighthouse and a fleet of your languages, sailing in your GitHub README."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=13.0,<14"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "setuptools>=77"]

[project.scripts]
git-ship = "git_ship.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_ship = ["assets/*.json", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
